name: Supabase Deploy

on:
  push:
    branches:
      - development
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 🔑 Set env dynamically based on branch
      - name: Set environment variables
        run: |
          BRANCH="${GITHUB_REF##*/}"

          echo "Running on branch: $BRANCH"

          if [[ "$BRANCH" == "development" ]]; then
            echo "ENV_NAME=development" >> $GITHUB_ENV
            echo "PROJECT_REF=${{ secrets.SUPABASE_DEV_PROJECT_REF }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> $GITHUB_ENV

          elif [[ "$BRANCH" == "staging" ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "PROJECT_REF=${{ secrets.SUPABASE_STAGING_PROJECT_REF }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> $GITHUB_ENV

          elif [[ "$BRANCH" == "main" ]]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "PROJECT_REF=${{ secrets.SUPABASE_PROD_PROJECT_REF }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> $GITHUB_ENV

          else
            echo "Unknown branch. Exiting."
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref $PROJECT_REF --password $DB_PASSWORD

      - name: Push database changes
        run: supabase db push

      - name: Deploy functions (if any)
        run: |
          if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions)" ]; then
            supabase functions deploy --no-verify-jwt
          else
            echo "No functions found. Skipping deployment."
          fi